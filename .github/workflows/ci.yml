name: Continuous Integration & Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: signature_verification_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: License Audit & Ultralytics Check
        run: |
          echo "Verifying no AGPL / Ultralytics dependencies are installed..."
          python -c "import sys; 'ultralytics' in sys.modules and sys.exit(1) or print('Ultralytics cleanly absent.')"
          pip list | grep -i ultralytics && exit 1 || echo "License check passed."

      - name: Run Unit and Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/signature_verification_test_db
          CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
          ENVIRONMENT: test
        run: |
          pytest -v --maxfail=3
