name: Continuous MLOps Training & Deployment Trigger

on:
  repository_dispatch:
    types: [hf_dataset_updated]
  workflow_dispatch:
    inputs:
      dataset_repo:
        description: 'Hugging Face Dataset Repository'
        required: true
        default: 'rakshitdabral/Signature-Verification-Dataset'
      model_type:
        description: 'Model to train'
        required: true
        default: 'rtdetr'
        type: choice
        options:
          - rtdetr
          - yolox
          - resnet50
          - vit

jobs:
  dispatch-training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify License & Dependencies Compliance
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "
          import sys
          # Enforce non-Ultralytics compliance
          try:
              import ultralytics
              print('CRITICAL: AGPL package detected. Failing pipeline.')
              sys.exit(1)
          except ImportError:
              print('License compliance verified: Zero AGPL copyleft packages found.')
          "

      - name: Dispatch Remote GPU Training Job
        env:
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
          COMET_PROJECT_NAME: "signature-detection-verify"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
        run: |
          echo "Triggering remote GPU training runner on AWS/Colab..."
          # Command to launch SageMaker Training Job or remote EC2 runner:
          # python training/deploy_hook.py --dataset "${{ github.event.inputs.dataset_repo }}" --model "${{ github.event.inputs.model_type }}"
          echo "Training trigger successfully dispatched with Comet ML experiment logging."
